name: collect

on:
  schedule:
    # JST 7:50 / 19:50（毎時0分は混雑するためずらす）。数時間遅れることがあるので、
    # cron-job.org からも workflow_dispatch で同じ時刻に起動している（二重に動いても新着だけ通知するので問題ない）
    - cron: '50 22 * * *'
    - cron: '50 10 * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Discord / LINE にテスト通知だけ送る'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: inputs.test_notify
        run: |
          test -n "$DISCORD_WEBHOOK_URL$LINE_CHANNEL_ACCESS_TOKEN" || { echo '::error::通知先の Secret（DISCORD_WEBHOOK_URL / LINE_CHANNEL_ACCESS_TOKEN）が未設定です'; exit 1; }
          node -e "import('./src/discord.js').then((d) => d.notify([], '✅ tcg-watch のテスト通知です。この通知が届けば設定は完了です。'))"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      - if: ${{ !inputs.test_notify }}
        run: npm run collect
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      - if: ${{ !inputs.test_notify }}
        run: node src/task-notify.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit data
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data
          git diff --cached --quiet || git commit -m 'data: update'
          git pull --rebase -q origin main
          git push
