name: inspect

# 巡回先の調整用。指定したURLのリンク一覧をログに出す（データは更新しない）。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'スペース区切りのURL'
        required: true
      text:
        description: 'リンク一覧ではなく本文を出す'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 入力はシェルに展開させず環境変数で渡す
      - run: node src/inspect.js $URLS
        env:
          URLS: ${{ inputs.urls }}
          INSPECT_TEXT: ${{ inputs.text && '1' || '' }}
