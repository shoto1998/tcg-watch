name: inspect

# 巡回先の調整用。指定したURLのリンク一覧をログに出す（データは更新しない）。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'スペース区切りのURL'
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/inspect.js ${{ inputs.urls }}
