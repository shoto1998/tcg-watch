name: habit

# 月・水・金の夜に「トレゲトで抽選に応募」の習慣タスクを作って LINE / Discord に通知する。
# 前回までに完了しなかった分は未達として閉じ、月曜は前週の完了率を振り返る。
#
# GitHub の schedule は数時間遅れることがあるため、主な起動は Claude Code のルーティン
# 「tcg-watch 朝の起動」が JST 20:57（月・水・金）に workflow_dispatch で行う。
# 下の schedule（JST 22:30）は予備で、その回をすでに通知済みなら何もしない。
on:
  schedule:
    - cron: '30 13 * * 1,3,5'
  workflow_dispatch:
    inputs:
      force:
        description: '通知済みでももう一度通知する'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: habit
  cancel-in-progress: false

jobs:
  habit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/habit.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_NOTIFY: ${{ inputs.force && 'true' || 'false' }}
